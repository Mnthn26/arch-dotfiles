# ===== Hyprlock Configuration (Catppuccin Mocha) =====

general {
    hide_cursor = true
    grace = 0
    disable_loading_bar = true
}

# Blurred desktop background
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.9
    brightness = 0.75
    vibrancy = 0.15
    vibrancy_darkness = 0.05
}

# Large Clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%I:%M')"
    color = rgba(245, 194, 231, 1.0) # Pink
    font_size = 112
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 280
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 6
    shadow_color = rgba(17, 17, 27, 0.6)
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %B %d')"
    color = rgba(205, 214, 244, 0.85) # Text
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 190
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(17, 17, 27, 0.6)
}

# Greeting
label {
    monitor =
    text = cmd[update:0] echo " Hello, $USER"
    color = rgba(203, 166, 247, 1.0) # Mauve
    font_size = 18
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 70
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(17, 17, 27, 0.6)
}

# Password Input Field (Pill-shaped)
input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.32
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(203, 166, 247, 0.55)
    inner_color = rgba(49, 50, 68, 0.72)
    font_color = rgba(205, 214, 244, 1.0)
    check_color = rgba(166, 227, 161, 0.85)
    fail_color = rgba(243, 139, 168, 0.85)
    fade_on_empty = true
    fade_timeout = 1000
    placeholder_text = <span foreground="##cdd6f4cc"><i> Enter password…</i></span>
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 200
    hide_input = false
    rounding = 999
    position = 0, 0
    halign = center
    valign = center
}

# Caps Lock Warning
label {
    monitor =
    text = cmd[update:200] [ "$(cat /sys/class/leds/input*::capslock/brightness 2>/dev/null | head -n1)" = "1" ] && echo " Caps Lock" || echo ""
    color = rgba(249, 226, 175, 1.0) # Yellow
    font_size = 13
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, -60
    halign = center
    valign = center
}
